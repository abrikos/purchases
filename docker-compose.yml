services:
  nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker_volumes/nginx:/etc/nginx/conf.d
    #restart: always
    depends_on:
      - backend

  backend:
    env_file:
      - ./.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/abrikoz

    build: .
    expose:
      - "8000"
    depends_on:
       - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb_purchase
    environment:
      - TZ=Asia/Yakutsk
    ports:
      - "27017"
    volumes:
      - mongo-data:/data/db

networks:
  default:

volumes:
  mongo-data:
    driver: local
