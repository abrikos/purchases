services:
  redis:
      image: redis:7.4-alpine
      container_name: my-redis
      restart: always
      ports:
        - "6379"
      volumes:
        - redis_data:/data
      command: redis-server --save 60 1 --loglevel warning

  nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker_volumes/nginx:/etc/nginx/conf.d
      - front_bundles:/usr/share/nginx/html/
    #restart: always
    depends_on:
      - backend

  celery:
    build: .
    command: celery -A abrikosio worker -l info
    volumes:
      - ./project/:/usr/src/app/
    environment:
      - DEBUG=1
      - SECRET_KEY=dbaa1_i7%*3r9-=z-+_mz4r-!qeed@(-a_r(g@k8jo8y3r27%m
      - DJANGO_ALLOWED_HOSTS=localhost  [::1]
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A abrikosio beat -l info
    volumes:
      - ./project/:/usr/src/app/
    environment:
      - DEBUG=1
      - SECRET_KEY=dbaa1_i7%*3r9-=z-+_mz4r-!qeed@(-a_r(g@k8jo8y3r27%m
      - DJANGO_ALLOWED_HOSTS=localhost  [::1]
    depends_on:
      - redis

  backend:
    env_file:
      - ./.env
    environment:
      DB_HOST: db
    build: .
    command: >
      bash -c "./start-django-in-docker.sh"
    volumes:
      - front_bundles:/app/docker_volumes/static
    expose:
      - "8000"
    depends_on:
       - db
       - redis
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .git/
            - .github/
            - static/
            - migrate.sh
            - freeze.sh

  db:
    image: postgres:16.0
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  default:

volumes:
  redis_data:
  postgres_data:
    driver: local
  front_bundles:
    driver: local
