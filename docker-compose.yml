services:
  backend:
    env_file:
      - ./.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/abrikoz

    build: .
    ports:
      - "8000:8000"
    depends_on:
       - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb_purchase
    environment:
      - TZ=Asia/Yakutsk
    ports:
      - "27017"
    volumes:
      - mongo-data:/data/db

networks:
  default:

volumes:
  mongo-data:
    driver: local
